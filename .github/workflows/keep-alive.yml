name: Keep Services Alive

on:
  schedule:
    # Every 14 min, 3am–2pm UTC (8:30am–7:30pm IST) — ~11 hrs/day × 2 services = 660 hrs/month
    # Stays within Render's 750 free instance hours/month per account
    - cron: '*/14 3-14 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://memoraai-backend-7cru.onrender.com/api/health)
          echo "Backend status: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Backend alive" || echo "⚠️ Backend may be cold starting"

      - name: Ping AI Service
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
            https://memoraai-ai-service-0uyz.onrender.com/)
          echo "AI Service status: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ AI Service alive" || echo "⚠️ AI Service may be cold starting"
