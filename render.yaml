services:
  - type: web
    name: memoraai-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        value: "https://memoraai-ai-service.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: NEMOTRON_API_KEY
        sync: false

  - type: web
    name: memoraai-ai-service
    env: docker
    dockerContext: ./ai-service
    dockerfilePath: ./ai-service/Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        value: "https://memoraai-backend.onrender.com"
      - key: HF_API_KEY
        sync: false
