server:
  port: ${PORT:8080}
  
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}

spring:
  application:
    name: memoraai-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/memoraai}
    username: ${SPRING_DATASOURCE_USERNAME:memoraai}
    password: ${SPRING_DATASOURCE_PASSWORD:memoraai_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:89q324y5q38479ytq384798y3q7498y3q47895tq34895t}
  expiration: ${JWT_EXPIRATION:86400000}

memoraai:
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    provider: ${LLM_PROVIDER:nemotron}
    hallucination-threshold: ${AI_HALLUCINATION_THRESHOLD:0.30}
    nemotron:
      api-key: ${NEMOTRON_API_KEY:}
      base-url: https://integrate.api.nvidia.com/v1
      model: nvidia/nemotron-3-super-120b-a12b
      timeout: 60s
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      model: ${AI_MODEL:llama3}
      timeout: ${AI_TIMEOUT:60s}
  chunking:
    chunk-size: ${CHUNKING_CHUNK_SIZE:1000}
    overlap: ${CHUNKING_OVERLAP:200}

storage:
  upload-dir: ${STORAGE_UPLOAD_DIR:storage/uploads/documents}

spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 50MB


management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
