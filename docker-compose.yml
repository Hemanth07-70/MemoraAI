services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: memoraai-postgres
    environment:
      POSTGRES_DB: memoraai
      POSTGRES_USER: memoraai
      POSTGRES_PASSWORD: memoraai_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - memoraai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoraai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: memoraai-ai-service
    environment:
      FASTEMBED_CACHE_PATH: /app/models
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/app/storage/uploads/documents
      - model_cache:/app/models
      - ./ai-service/app:/app/app
    networks:
      - memoraai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memoraai-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/memoraai
      SPRING_DATASOURCE_USERNAME: memoraai
      SPRING_DATASOURCE_PASSWORD: memoraai_secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AI_SERVICE_URL: http://ai-service:8000
      LLM_PROVIDER: nemotron
      NEMOTRON_API_KEY: ${NEMOTRON_API_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8080:8080"
    volumes:
      - document_storage:/app/storage/uploads/documents
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - memoraai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memoraai-frontend
    environment:
      VITE_BACKEND_URL: http://localhost:8080
      VITE_AI_SERVICE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - memoraai-network
    restart: unless-stopped

volumes:
  postgres_data:
  document_storage:
  model_cache:

networks:
  memoraai-network:
    driver: bridge
